services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # SQLite by default (zero infra). Swap to Postgres with:
      #   DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/market_intel
      DATABASE_URL: sqlite:////data/market_intel.db
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # OpenD runs on the host; reach it via host.docker.internal
      MOOMOO_HOST: ${MOOMOO_HOST:-host.docker.internal}
      MOOMOO_PORT: ${MOOMOO_PORT:-11111}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      NEWS_BASE_URL: ${NEWS_BASE_URL:-https://ai-news-search.futunn.com}
      NEWS_LANG: ${NEWS_LANG:-en}
      NEWS_SIZE: ${NEWS_SIZE:-20}
    volumes:
      - backend_data:/data
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  backend_data:
